<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SalesDay Mission Control: colour schemes</title>
<link rel="stylesheet" href="widgets.css">
<style>
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:#0b0d0e;color:#EEF1F0;font:14px/1.45 var(--ui);padding:20px max(16px,env(safe-area-inset-left,0px)) 56px max(16px,env(safe-area-inset-right,0px))}
.top{max-width:1500px;margin:0 auto 16px}.top h1{margin:0 0 4px;font-family:var(--num);font-size:clamp(24px,3vw,32px);font-weight:400;letter-spacing:-.02em}.top p{margin:0;color:#aab3ae;max-width:760px}
.opts{max-width:1500px;margin:0 auto;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.opt{position:relative;border-radius:30px;padding:20px;overflow:hidden;color:var(--ink);background:radial-gradient(900px 480px at 10% -10%,var(--glow1),transparent 60%),radial-gradient(700px 480px at 100% 0,var(--glow2),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg0) 62%);border:1px solid var(--line)}
.oh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.oh img{height:30px;width:auto;display:block}.oh .nm{margin-left:auto;text-align:right}.oh .nm b{display:block;font-size:17px;font-weight:600}.oh .nm span{font-size:12px;color:var(--ink2)}
.key{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--a2);color:var(--onA2);font-weight:600;font-size:14px}
.sw{display:flex;gap:6px;margin:0 0 14px}.sw i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid var(--line)}
.g{display:grid;gap:12px;grid-template-columns:repeat(6,1fr)}
.c{grid-column:span 3;min-width:0;border-radius:22px;padding:16px 18px;border:1px solid var(--line);background:linear-gradient(150deg,var(--card1),var(--card2) 58%);box-shadow:inset 0 1px 0 var(--line),0 22px 40px -28px var(--shadow);backdrop-filter:blur(18px)}
.c.tint{background:linear-gradient(150deg,var(--tint1),var(--tint2) 62%,var(--card2))}.c.w6{grid-column:span 6}.c.w2{grid-column:span 2}
@media(max-width:760px){.c,.c.w2{grid-column:span 6}}
.hero{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:14px;align-items:center}.rg{position:relative;aspect-ratio:1;max-width:170px}.rg svg{width:100%;height:100%;transform:rotate(-90deg)}.rg .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.rg .mid b{font-family:var(--num);font-size:24px;font-weight:400;line-height:1}.rg .mid span{font-size:9px;color:var(--ink2);max-width:52px;margin:0 auto}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.kp b{display:block;font-family:var(--num);font-size:26px;font-weight:400;line-height:1.1}.kp span{font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:6px}.kp i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ttl{font-size:14px;font-weight:600;margin:0 0 10px}canvas{display:block;width:100%;height:96px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--track);color:var(--ink2)}.pill.hi{background:var(--a5);color:var(--bg0)}
</style></head><body>
<div class="top"><h1>Pick a colour scheme</h1><p>Five finished options, each showing the same live widgets with the SalesDay wordmark. Tell me the number (1 to 5). I will then roll it out to the whole dashboard and the public page, and we can still fine-tune single colours.</p></div>
<div class="opts" id="opts"></div>
<script src="theme.js"></script><script src="widgets.js"></script>
<script>
const KEYS=['forest','cobalt','graphite','aubergine','porcelain'];
async function load(){for(const u of ['api/state','demo-state.json']){try{const r=await fetch(u,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}throw new Error('no data')}
function opt(k,i,s){
  const t=THEMES[k],d=widgetData(s),root=document.createElement('section');root.className='opt';root.setAttribute('aria-label',t.name);applyTheme(k,root);
  const logo=t.mode==='dark'?'brand/salesday-wordmark-reversed.svg':'brand/salesday-wordmark-primary.svg';
  root.innerHTML=`<div class="oh"><span class="key">${i+1}</span><img src="${logo}" alt="SalesDay" height="30"><div class="nm"><b>${t.name}</b><span>${t.note}</span></div></div><div class="sw">${['a1','a2','a3','a4','a5'].map(c=>`<i style="background:var(--${c})"></i>`).join('')}</div><div class="g">
  <div class="c tint w6"><div class="hero"><div class="rg" data-r></div><div><div class="ttl">Where we are</div><div class="kp" data-k></div></div></div></div>
  <div class="c" data-dm></div><div class="c" data-dp></div>
  <div class="c w6" data-ds></div>
  <div class="c w6" data-mt></div>
  <div class="c w6"><div class="ttl">Rows updated, live trend</div><canvas data-sp></canvas></div></div>`;
  const S=s.status,o=s.totals.open||1;
  root.querySelector('[data-r]').append(ring([{v:s.totals.done/(s.totals.rows||1),color:'var(--a1)'},{v:S.I/o,color:'var(--a2)'},{v:(S.P+S.B)/o,color:'var(--a3)'},{v:S.N/o,color:'var(--a4)'}]));
  const mid=document.createElement('div');mid.className='mid';mid.innerHTML=`<b>${s.totals.open}</b><span>open items</span>`;root.querySelector('[data-r]').append(mid);
  root.querySelector('[data-k]').innerHTML=[['Done',S.C,'a1'],['In progress',S.I,'a2'],['Pending',S.P,'a3'],['Not started',S.N,'a4']].map(([n,v,c])=>`<div><b>${v}</b><span><i style="background:var(--${c})"></i>${n}</span></div>`).join('');
  return root;
}
load().then((s)=>{const w=document.getElementById('opts');KEYS.forEach((k,i)=>{const r=opt(k,i,s),d=widgetData(s);w.append(r);
  dotMatrix(r.querySelector('[data-dm]'),{title:'Delivery score',value:d.done,total:d.rows,items:d.items,cols:6});
  dotPlot(r.querySelector('[data-dp]'),{title:'Throughput',unit:'rows',points:d.weekDots});
  dayStrip(r.querySelector('[data-ds]'),{days:d.wk,max:d.max,min:d.min});
  moodTracker(r.querySelector('[data-mt]'),{ranges:{Week:d.week,'24 h':d.hours}});
  sparkArea(r.querySelector('[data-sp]'),d.weekDots.map(x=>x.v).concat(d.hours.slice(-5).map(x=>x.v)),themeColor(r,'a1'))})}).catch(()=>{document.getElementById('opts').textContent='Could not load the demo data.'});
</script></body></html>
